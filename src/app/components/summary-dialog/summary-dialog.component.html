<h2 mat-dialog-title>Summary</h2>
<mat-dialog-content>
  <div *ngFor="let field of dataFields">
    <p><strong>{{ field.label }}:</strong> {{ field.value }}</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions [attr.align]="'end'">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
