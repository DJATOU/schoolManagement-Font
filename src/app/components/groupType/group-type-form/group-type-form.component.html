<!-- Title above the form -->
<div class="form-title">
  <h1 class="mat-h1">Group Type Details</h1>
</div>
<form [formGroup]="groupTypeForm" (ngSubmit)="onSubmit()" class="form-container">
    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <input matInput formControlName="name">
      <mat-error *ngIf="groupTypeForm.get('name')?.invalid">Name is required</mat-error>

    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Size</mat-label>
      <input matInput type="number" formControlName="size">
      <mat-error *ngIf="groupTypeForm.controls['size']?.errors?.['required']">Size is required</mat-error>
    </mat-form-field>
  
    <div class="button-container">
        <button mat-raised-button color="primary" type="submit" class="submit-button">Submit</button>
        <button mat-raised-button color="primary" type="button" class="submit-button" (click)="onClearForm()">Clear</button>
    </div>
  </form>
