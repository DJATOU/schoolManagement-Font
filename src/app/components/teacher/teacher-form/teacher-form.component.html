<form [formGroup]="teacherForm" (ngSubmit)="onSubmit()" class="form-container">
  <h2 class="form-title">Teacher Registration Form</h2>
  <mat-tab-group class="tab-group">
    <mat-tab label="Basic Information">
      <div class="tab-content" formGroupName="basicInformation">
        <mat-form-field appearance="fill">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Gender</mat-label>
          <mat-select formControlName="gender">
            <mat-option value="male">Male</mat-option>
            <mat-option value="female">Female</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="photo-field">
          <mat-label>Upload Photo</mat-label>
          <div class="upload-container">
            <input matInput readonly [value]="selectedFile?.name" placeholder="No file chosen" class="upload-input">
            <button type="button" mat-raised-button color="accent" (click)="photoInput.click()" class="upload-button">
            <mat-icon>attach_file</mat-icon> Choose a picture
          </button>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" hidden #photoInput>
        </div>
        </mat-form-field>
        
        
      </div>
    </mat-tab>
    <mat-tab label="Contact Information">
      <div class="tab-content" formGroupName="contactInformation">
        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phoneNumber">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>City</mat-label>
          <input matInput formControlName="city">
        </mat-form-field>
      </div>
    </mat-tab>
    <mat-tab label="Professional Details">
      <div class="tab-content" formGroupName="professionalDetails">
        <mat-form-field appearance="fill">
          <mat-label>Date of Birth</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dateOfBirth">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Place of Birth</mat-label>
          <input matInput formControlName="placeOfBirth">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Specialization</mat-label>
          <input matInput formControlName="specialization">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Qualifications</mat-label>
          <textarea matInput formControlName="qualifications"></textarea>
        </mat-form-field>
      </div>
    </mat-tab>
    <mat-tab label="Other Information">
      <div class="tab-content" formGroupName="otherInformation">
        <mat-form-field appearance="fill">
          <mat-label>Years of Experience</mat-label>
          <input matInput type="number" formControlName="yearsOfExperience">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Nationality</mat-label>
          <input matInput formControlName="nationality">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Marital Status</mat-label>
          <mat-select formControlName="maritalStatus">
            <mat-option value="single">Single</mat-option>
            <mat-option value="married">Married</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Communication Preferences</mat-label>
          <input matInput formControlName="communicationPreference">
        </mat-form-field>
      </div>
    </mat-tab>
  </mat-tab-group>

  <div class="button-container">
    <button mat-raised-button color="primary" type="submit" class="submit-button">Submit</button>
    <button mat-raised-button color="accent" type="button" class="clear-button" (click)="onClearForm()">Clear</button>
  </div>
</form>
