<div class="content-container">
  <mat-toolbar class="view-toggle-toolbar">
    <button mat-button
            [class.active]="viewMode === 'card'"
            (click)="changeViewMode('card')">
      <mat-icon>view_comfy</mat-icon>
      Grid
    </button>
    <button mat-button
            [class.active]="viewMode === 'list'"
            (click)="changeViewMode('list')">
      <mat-icon>view_list</mat-icon>
      List
    </button>
  </mat-toolbar>

  <div class="student-view" [ngClass]="{'card-view': viewMode === 'card', 'list-view': viewMode === 'list'}">
    <ng-container *ngIf="viewMode === 'card'">
      <app-student-card *ngFor="let student of currentPageStudents" [student]="student"></app-student-card>
    </ng-container>
    <ng-container *ngIf="viewMode === 'list'">
      <app-student-list-item *ngFor="let student of currentPageStudents" [student]="student"></app-student-list-item>
    </ng-container>
  </div>
  

  <mat-paginator [length]="totalStudents"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="pageSizeOptions"
                 (page)="changePage($event)">
  </mat-paginator>
</div>
